<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Приглашение для Медины 🌸</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            width: 100vw;
            height: 100vh;
            overflow: hidden;
            font-family: 'Segoe UI', 'Comic Sans MS', cursive, sans-serif;
            background: linear-gradient(135deg, #fbc2eb 0%, #a18cd1 50%, #fad0c4 100%);
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
        }

        /* Падающие сердечки */
        .hearts {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 0;
        }

        .heart {
            position: absolute;
            font-size: 24px;
            color: rgba(255, 255, 255, 0.7);
            animation: fall linear infinite;
        }

        @keyframes fall {
            0% {
                transform: translateY(-10vh) rotate(0deg);
                opacity: 0.9;
            }
            100% {
                transform: translateY(110vh) rotate(720deg);
                opacity: 0;
            }
        }

        /* Основной контейнер */
        .container {
            position: relative;
            z-index: 10;
            background: rgba(255, 255, 255, 0.25);
            backdrop-filter: blur(12px);
            border-radius: 40px;
            padding: 50px 40px;
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.2);
            text-align: center;
            max-width: 500px;
            width: 90%;
            transition: all 0.4s ease;
        }

        h1 {
            font-size: 2.8rem;
            color: #fff;
            text-shadow: 2px 2px 10px rgba(0,0,0,0.2);
            margin-bottom: 30px;
            font-weight: 600;
            letter-spacing: 2px;
        }

        .question {
            font-size: 1.8rem;
            color: #fff;
            margin-bottom: 40px;
            text-shadow: 1px 1px 8px rgba(0,0,0,0.15);
        }

        .buttons {
            display: flex;
            justify-content: center;
            gap: 40px;
            flex-wrap: wrap;
            position: relative;
        }

        .btn {
            padding: 18px 45px;
            font-size: 1.5rem;
            border: none;
            border-radius: 50px;
            cursor: pointer;
            font-weight: bold;
            text-transform: uppercase;
            letter-spacing: 1px;
            transition: transform 0.2s, box-shadow 0.2s;
            box-shadow: 0 10px 25px rgba(0,0,0,0.2);
            user-select: none;
        }

        .btn-yes {
            background: #ff7eb3;
            color: white;
        }
        .btn-yes:hover {
            transform: scale(1.08);
            box-shadow: 0 15px 30px rgba(255, 126, 179, 0.5);
        }

        .btn-no {
            background: #a0a0a0;
            color: white;
            position: relative; /* будет изменяться через JS */
            transition: left 0.1s ease, top 0.1s ease;
        }

        /* Секция выбора места (скрыта изначально) */
        .place-section {
            display: none;
            margin-top: 30px;
        }

        .place-section h2 {
            color: white;
            font-size: 2rem;
            margin-bottom: 25px;
            text-shadow: 2px 2px 8px rgba(0,0,0,0.2);
        }

        .places {
            display: flex;
            flex-direction: column;
            gap: 15px;
            align-items: center;
        }

        .place-btn {
            background: white;
            color: #7b5ea7;
            border: none;
            padding: 15px 35px;
            font-size: 1.3rem;
            border-radius: 40px;
            cursor: pointer;
            font-weight: bold;
            width: 80%;
            max-width: 320px;
            box-shadow: 0 8px 20px rgba(0,0,0,0.15);
            transition: all 0.3s;
        }
        .place-btn:hover {
            background: #ffddee;
            transform: translateY(-3px);
            box-shadow: 0 12px 25px rgba(0,0,0,0.25);
        }

        .final-message {
            display: none;
            font-size: 2rem;
            color: white;
            margin-top: 20px;
            text-shadow: 2px 2px 10px rgba(0,0,0,0.2);
        }
    </style>
</head>
<body>
    <!-- Падающие сердца -->
    <div class="hearts" id="heartsContainer"></div>

    <!-- Основной блок -->
    <div class="container" id="mainContainer">
        <div id="inviteBlock">
            <h1>🌷 Медина 🌷</h1>
            <div class="question">Пойдём гулять?</div>
            <div class="buttons">
                <button class="btn btn-yes" id="btnYes">Да 💖</button>
                <button class="btn btn-no" id="btnNo">Нет 🏃‍♀️</button>
            </div>
        </div>

        <!-- Блок выбора места (появляется после "Да") -->
        <div class="place-section" id="placeSection">
            <h2>Куда пойдём? ✨</h2>
            <div class="places">
                <button class="place-btn" data-place="Парк Победы">🌳 Парк Победы</button>
                <button class="place-btn" data-place="Набережная">🌊 Набережная</button>
                <button class="place-btn" data-place="Площадь">🏛 Площадь</button>
                <button class="place-btn" data-place="ТЦ Инфинити Молл">🛍 ТЦ Инфинити Молл</button>
            </div>
        </div>

        <!-- Финальное сообщение -->
        <div class="final-message" id="finalMessage">
            Спасибо, солнце! ☀️<br>Я скоро напишу тебе 💌
        </div>
    </div>

    <script>
        // ---------- Генерация падающих сердечек ----------
        const heartsContainer = document.getElementById('heartsContainer');
        const heartSymbols = ['❤️', '🌸', '💕', '✨', '💖', '🌷', '💗'];
        for (let i = 0; i < 25; i++) {
            const heart = document.createElement('span');
            heart.classList.add('heart');
            heart.innerHTML = heartSymbols[Math.floor(Math.random() * heartSymbols.length)];
            heart.style.left = Math.random() * 100 + '%';
            heart.style.animationDuration = (Math.random() * 5 + 5) + 's';
            heart.style.animationDelay = Math.random() * 5 + 's';
            heart.style.fontSize = (Math.random() * 24 + 16) + 'px';
            heartsContainer.appendChild(heart);
        }

        // ---------- Убегающая кнопка "Нет" ----------
        const btnNo = document.getElementById('btnNo');
        const btnYes = document.getElementById('btnYes');
        const inviteBlock = document.getElementById('inviteBlock');
        const placeSection = document.getElementById('placeSection');
        const finalMessage = document.getElementById('finalMessage');
        const mainContainer = document.getElementById('mainContainer');

        function moveNoButton() {
            const maxX = window.innerWidth - btnNo.offsetWidth;
            const maxY = window.innerHeight - btnNo.offsetHeight;
            const randomX = Math.max(20, Math.floor(Math.random() * (maxX - 40)));
            const randomY = Math.max(20, Math.floor(Math.random() * (maxY - 40)));
            btnNo.style.position = 'fixed';
            btnNo.style.left = randomX + 'px';
            btnNo.style.top = randomY + 'px';
        }

        btnNo.addEventListener('mouseenter', moveNoButton);
        btnNo.addEventListener('mousemove', moveNoButton);
        btnNo.addEventListener('touchstart', (e) => {
            e.preventDefault();
            moveNoButton();
        });

        // ---------- Обработка нажатия "Да" ----------
        btnYes.addEventListener('click', () => {
            inviteBlock.style.display = 'none';
            placeSection.style.display = 'block';
            mainContainer.style.padding = '40px 30px';
        });

        // ---------- Выбор места и отправка ----------
        const placeButtons = document.querySelectorAll('.place-btn');
        placeButtons.forEach(btn => {
            btn.addEventListener('click', () => {
                const chosenPlace = btn.getAttribute('data-place');
                placeSection.style.display = 'none';
                finalMessage.style.display = 'block';
                sendChoiceToTelegram(chosenPlace);
            });
        });

        function sendChoiceToTelegram(place) {
            // 🔥 Твой токен уже здесь (замени только chatId)
            const token = '8910613345:AAFh7cMX5OdTEk_ubhTPLtkvgFvuQhYlKGE';
            const chatId = '7551615312';   // ⚠️ СЮДА ВСТАВЬ СВОЙ ЧИСЛОВОЙ ID

            const message = `🌹 Медина выбрала: ${place}`;

            // Если chatId не задан — просто покажем alert (для теста)
            if (chatId === 'YOUR_CHAT_ID') {
                alert('Сначала укажи свой chat_id в коде!\n\n(Сейчас просто тест) Медина выбрала: ' + place);
                console.log('Тест: ' + message);
                return;
            }

            const url = `https://api.telegram.org/bot${token}/sendMessage?chat_id=${chatId}&text=${encodeURIComponent(message)}`;
            fetch(url)
                .then(response => response.json())
                .then(data => {
                    if (data.ok) {
                        console.log('✅ Успешно отправлено в Telegram');
                    } else {
                        console.error('Ошибка отправки:', data);
                        alert('Не удалось отправить выбор. Проверь chat_id.');
                    }
                })
                .catch(error => {
                    console.error('Ошибка сети:', error);
                    alert('Ошибка соединения. Проверь интернет.');
                });
        }
    </script>
</body>
</html>
